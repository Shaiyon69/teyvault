# Push a tag like v1.0.0 to build the Windows installer and Android APK and publish them as the
# teyvault-v* release on Shaiyon69/Skibidevs: binaries ship only from the website, never from this repo.
# Run it by hand with a tag to (re)build an existing release. iOS is left out: it needs an Apple developer
# account to sign.
# SKIBIDEVS_TOKEN: fine-grained token with Contents read/write on Shaiyon69/Skibidevs only.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v1.6.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `flet pack` (PyInstaller), not `flet build`: the packed exe is a real Python, so it can
      # re-launch itself as the HoYoLAB login window (main.py --weblogin).
      - run: pip install . pyinstaller "flet[all]==1.0.3"
      - name: Build installer
        shell: pwsh
        run: |
          $version = (python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          flet pack main.py --onedir --yes --name Teyvault --product-name Teyvault --product-version $version --icon assets/icon.ico --add-data "teyvat/data:teyvat/data" --hidden-import openpyxl webview
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          iscc /DVersion=$version installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Teyvault-Setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "flet[all]==1.0.3"
      - run: flet build apk --yes
      - run: mkdir -p dist && cp "$(ls build/apk/*.apk | head -1)" dist/Teyvault.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/Teyvault.apk

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # A release written by hand keeps its notes; the builds replace any old assets.
      - name: Publish Skibidevs release
        env:
          GH_TOKEN: ${{ secrets.SKIBIDEVS_TOKEN }}
          GH_REPO: Shaiyon69/Skibidevs
        run: |
          test -n "$GH_TOKEN" || { echo "::error::Set the SKIBIDEVS_TOKEN secret"; exit 1; }
          if gh release view "teyvault-$TAG" >/dev/null 2>&1; then
            gh release upload "teyvault-$TAG" assets/* --clobber
          else
            gh release create "teyvault-$TAG" assets/* --title "Teyvault ${TAG#v}" --notes "Changes: https://github.com/Shaiyon69/teyvault/commits/$TAG"
          fi
          # The site refreshes its download list on this event.
          gh api "repos/$GH_REPO/dispatches" -f event_type=app-released

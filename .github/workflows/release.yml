# Push a tag like v1.0.0 to build the Windows installer and Android APK and attach them
# to a GitHub Release. iOS is left out: it needs an Apple developer account to sign.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `flet pack` (PyInstaller), not `flet build`: the packed exe is a real Python, so it can
      # re-launch itself as the HoYoLAB login window (main.py --weblogin).
      - run: pip install . pyinstaller "flet[all]==1.0.3"
      - name: Build installer
        shell: pwsh
        run: |
          $version = (python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          flet pack main.py --onedir --yes --name Teyvault --product-name Teyvault --product-version $version --add-data "teyvat/data:teyvat/data" --hidden-import openpyxl webview
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          iscc /DVersion=$version installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Teyvault-Setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "flet[all]==1.0.3"
      - run: flet build apk --yes
      - run: mkdir -p dist && cp "$(ls build/apk/*.apk | head -1)" dist/Teyvault.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/Teyvault.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Teyvault-Setup.exe
            Teyvault.apk
          generate_release_notes: true
